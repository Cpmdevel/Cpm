{% extends 'base.html' %}
{% block content %}
  <h2>Бүртгүүлэх</h2>
  <form method="post" class="mt-3" autocomplete="off">
    <div class="mb-3">
      <label class="form-label">И-мэйл</label>
      <input type="email" name="email" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Нууц үг</label>
      <input type="password" name="password" class="form-control" required />
    </div>
    <button class="btn btn-primary" type="submit">Бүртгүүлэх</button>
  </form>
{% endblock %}
